  const audioOptions     = $('audioOptions');
  const seasonSection    = $('seasonSection');
  const seasonOptions    = $('seasonOptions');
  const episodeSection   = $('episodeSection');
  const episodeOptions   = $('episodeOptions');
  const epNav            = $('epNav');
  const prevEpBtn        = $('prevEpBtn');
  const nextEpBtn        = $('nextEpBtn');
  const speedOptions     = $('speedOptions');
  const stepOptions      = $('stepOptions');
  const ambientToggle    = $('ambientToggle');
  const copyLinkBtn      = $('copyLinkBtn');
  const copyLinkBtnText  = copyLinkBtn.querySelector('span');
  const manualForm       = $('manualForm');
  const manualUrlInput   = $('manualUrl');
  const copyInputBtn     = $('copyInputBtn');
  const playInputBtn     = $('playInputBtn');

  // State
  let currentHls = null;
  let currentBlobUrl = null;
  let playbackId = 0;
  let userSpeed = 1;
  let currentStep = 10;
  let currentUrl = '';
  let audioNames = [];  // подписи озвучек из ссылки (&audio=...)
  let fallbackUrl = '';  // запасной iframe источника (&fallback=...; §13)
  let fallbackUsed = false;  // фолбэк уже применён — не зацикливаемся
  let mp4Guard = null;  // U31: сторож прямого MP4 (нет метаданных → фолбэк)
  // U26: навигация серий внутри плеера (вариант D) — список серий страница
  // берёт сама у catalog-api движка (в ссылке только id тайтла и база API).
  let catalogApi = '';       // база catalog-api (&capi=...)
  let contentId = '';        // внутренний id тайтла у движка (&cid=...)
  let curSeason = null;      // текущий сезон
  let curEpisode = null;     // текущая серия
  let episodesIndex = null;  // {seasons: [...], bySeason: {сезон: [{ep, title, url}]}}
  let isSeeking = false;
  let showRemaining = false;
  let settingsOpen = false;
  let isLocked = false;
  let isPausedByDrag = false;
  let controlsHideTimer = null;
  let toastTimer = null;
  let pointerDown = null;
  let clickTimeout = null;
  let spaceHoldTimer = null;
  let spaceHeld = false;
  let spaceTriggeredSpeed = false;
  let ambientCanvas = document.createElement('canvas');
  let ambientCtx = ambientCanvas.getContext('2d', { willReadFrequently: true });
  let ambientLoop = null;

  // ============================================================
  //  Helpers
  // ============================================================
  const normalizeUrl = url => {
    if (!url) return '';
    url = url.trim();
    if (url.startsWith('//')) return 'https:' + url;
    if (!/^https?:\/\//i.test(url)) return 'https://' + url;
    return url;
  };
  const formatTime = sec => {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    return m + ':' + String(s).padStart(2,'0');
  };
  // Шаг 3.4: тост нейтральный; красный — только для ошибок.
  // Шаг 3.2: с флагом `retry` показываем оверлей с действиями вместо тоста.
  const showToast = (msg, opts) => {
    if (opts && opts.retry) { showErrorOverlay(msg); return; }
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.toggle('toast-error', !!(opts && opts.error));
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  };
  // Шаг 3.3: подпись загрузки + подсказка, если источник отвечает долго.
  let loadingHintTimer = null;
  const setLoading = on => {
    loadingOverlay.classList.toggle('hidden', !on);
    loadingText.textContent = 'Загрузка…';
    clearTimeout(loadingHintTimer);
    if (on) {
      loadingHintTimer = setTimeout(() => {
        if (!loadingOverlay.classList.contains('hidden')) loadingText.textContent = 'Источник отвечает медленно…';
      }, 10000);
    }
  };

  // ============================================================
  //  Шаг 3.1: «большая кнопка Play»
  //  В WebView (особенно Telegram/iOS) программный play() часто
  //  отклоняется с NotAllowedError — тогда показываем крупную кнопку.
  // ============================================================
  function showBigPlay() { bigPlay.classList.remove('hidden'); }
  function hideBigPlay() { bigPlay.classList.add('hidden'); }
  function autoplay() {
    const p = nativeVideo.play();
    if (p && typeof p.catch === 'function') {
      p.catch(err => { if (err && err.name === 'NotAllowedError') showBigPlay(); });
    }
    return p;
  }
  bigPlay.addEventListener('click', () => { autoplay(); });
  nativeVideo.addEventListener('play', hideBigPlay);

  // ============================================================
  //  Шаг 3.2: оверлей ошибки с действиями
  // ============================================================
  function hasNextEpisode() {
    const flat = flatEpisodes();
    const pos = flat.findIndex(x => x.season === curSeason && x.ep === curEpisode);
    return pos >= 0 && pos < flat.length - 1;
  }
  function showErrorOverlay(msg) {
    errorTitle.textContent = msg || 'Не удалось воспроизвести';
    errorFallbackBtn.classList.toggle('hidden', !(fallbackUrl && !fallbackUsed));
    errorNextBtn.classList.toggle('hidden', !hasNextEpisode());
    setLoading(false);
    errorOverlay.classList.remove('hidden');
  }
  function hideErrorOverlay() { errorOverlay.classList.add('hidden'); }
  errorRetryBtn.addEventListener('click', () => {
    hideErrorOverlay();
    if (currentUrl) loadFromUrl(currentUrl);
  });
  errorFallbackBtn.addEventListener('click', () => {
    hideErrorOverlay();
    if (fallbackUrl) { fallbackUsed = true; playEmbed(fallbackUrl); }
  });
  errorNextBtn.addEventListener('click', () => {
    hideErrorOverlay();
    stepEpisode(1);
  });

  // ============================================================
  //  Controls Visibility
  // ============================================================
  function showControls() {
    if (isLocked || playerContainer.classList.contains('embed-mode')) return;
    playerContainer.classList.add('controls-visible');
    clearTimeout(controlsHideTimer);
    if (!nativeVideo.paused && !settingsOpen && !pointerDown) {
      controlsHideTimer = setTimeout(() => {
        if (!settingsOpen && !pointerDown) playerContainer.classList.remove('controls-visible');
      }, 2500);
    }
  }
  function hideControlsNow() {
    clearTimeout(controlsHideTimer);
    if (!nativeVideo.paused && !settingsOpen && !pointerDown) {
      playerContainer.classList.remove('controls-visible');
    }
  }
  function updatePausedClass() {
    playerContainer.classList.toggle('paused', nativeVideo.paused);
    if (!nativeVideo.paused) showControls();
  }
  nativeVideo.addEventListener('play', updatePausedClass);
  nativeVideo.addEventListener('pause', updatePausedClass);
  
  playerContainer.addEventListener('mousemove', showControls);
  playerContainer.addEventListener('mouseleave', hideControlsNow);
  controlsEl.addEventListener('mouseenter', () => {
    clearTimeout(controlsHideTimer);
    if (!playerContainer.classList.contains('embed-mode')) {
      playerContainer.classList.add('controls-visible');
    }
  });

  // ============================================================
  //  Lock
  // ============================================================
  lockBtn.addEventListener('click', e => {
    e.stopPropagation();
    isLocked = !isLocked;
    playerContainer.classList.toggle('locked', isLocked);
    lockBtn.querySelector('.icon-unlocked').classList.toggle('hidden', isLocked);
    lockBtn.querySelector('.icon-locked').classList.toggle('hidden', !isLocked);
    if (isLocked) {
      playerContainer.classList.remove('controls-visible');
    } else {
      showControls();
    }
  });

  // ============================================================
  //  Ambient Mode
  // ============================================================
  function startAmbient() {
    if (ambientLoop) cancelAnimationFrame(ambientLoop);
    ambientCanvas.width = 16;
    ambientCanvas.height = 16;
    const tick = () => {
      if (!ambientToggle.checked || nativeVideo.paused || nativeVideo.ended || nativeVideo.classList.contains('hidden') || playerContainer.classList.contains('embed-mode')) {
        playerOuter.classList.remove('ambient');
        ambientLoop = requestAnimationFrame(tick);
        return;
      }
      try {
        ambientCtx.drawImage(nativeVideo, 0, 0, 16, 16);
        const data = ambientCtx.getImageData(0, 0, 16, 16).data;
        let r = 0, g = 0, b = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i+1]; b += data[i+2];
        }
        const px = data.length / 4;
        r = Math.round(r / px); g = Math.round(g / px); b = Math.round(b / px);
        playerOuter.style.setProperty('--ambient-color', `rgba(${r},${g},${b},0.4)`);
        playerOuter.classList.add('ambient');
      } catch (e) {
        playerOuter.classList.remove('ambient');
      }
      ambientLoop = requestAnimationFrame(tick);
    };
    tick();
  }
  ambientToggle.addEventListener('change', () => {
    if (ambientToggle.checked) startAmbient();
    else {
      if (ambientLoop) cancelAnimationFrame(ambientLoop);
      playerOuter.classList.remove('ambient');
    }
    saveSettings();
  });

  // ============================================================
  //  Progress
  // ============================================================
  function updateProgress() {
    if (isSeeking) return;
    const dur = nativeVideo.duration || 0;
    const cur = nativeVideo.currentTime || 0;
    const pct = dur ? (cur / dur) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    if (!progressInput.matches(':active')) {
      progressInput.value = dur ? Math.round((cur / dur) * 1000) : 0;
    }
    const curStr = formatTime(cur);
    let totalStr;
    if (showRemaining) totalStr = '-' + formatTime(Math.max(0, dur - cur));
    else totalStr = formatTime(dur);
    timeCurrent.textContent = curStr;
    timeTotal.textContent = totalStr;

    if (nativeVideo.buffered.length) {
      const bufEnd = nativeVideo.buffered.end(nativeVideo.buffered.length - 1);
      progressBuffer.style.width = dur ? (bufEnd / dur) * 100 + '%' : '0%';
    }
  }
  nativeVideo.addEventListener('timeupdate', updateProgress);
  nativeVideo.addEventListener('durationchange', updateProgress);
  nativeVideo.addEventListener('progress', updateProgress);
  nativeVideo.addEventListener('loadedmetadata', updateProgress);

  function seekToTime(time) {
    if (!isFinite(nativeVideo.duration)) return;
    nativeVideo.currentTime = Math.max(0, Math.min(nativeVideo.duration, time));
  }

  progressInput.addEventListener('input', () => {
    isSeeking = true;
    const dur = nativeVideo.duration || 0;
    const pct = progressInput.value / 1000;
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
    timeCurrent.textContent = formatTime(pct * dur);
  });
  progressInput.addEventListener('change', () => {
    const dur = nativeVideo.duration || 0;
    seekToTime((progressInput.value / 1000) * dur);
    isSeeking = false;
    showControls();
  });
  
  progressWrapper.addEventListener('mousemove', e => {
    if (!nativeVideo.duration) return;
    const rect = progressWrapper.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const time = pct * nativeVideo.duration;
    seekPreviewTime.textContent = formatTime(time);
    seekPreview.style.left = (pct * 100) + '%';
    seekPreview.classList.add('active');
  });
  progressWrapper.addEventListener('mouseleave', () => seekPreview.classList.remove('active'));

  timeDisplay.addEventListener('click', () => {
    showRemaining = !showRemaining;
    updateProgress();
  });

  // ============================================================
  //  Playback Controls
  // ============================================================
  function togglePlay() {
    if (nativeVideo.paused) nativeVideo.play().catch(() => {});
    else nativeVideo.pause();
  }
  playBtn.addEventListener('click', togglePlay);
  nativeVideo.addEventListener('play', () => {
    iconPlay.classList.add('hidden');
    iconPause.classList.remove('hidden');
    updatePausedClass();
  });
  nativeVideo.addEventListener('pause', () => {
    iconPlay.classList.remove('hidden');
    iconPause.classList.add('hidden');
    updatePausedClass();
  });

  const skipBy = sec => seekToTime(nativeVideo.currentTime + sec);
  skipBackBtn.addEventListener('click', () => skipBy(-currentStep));
  skipFwdBtn.addEventListener('click', () => skipBy(currentStep));

  function updateVolumeIcon() {
    const v = nativeVideo.muted ? 0 : nativeVideo.volume;
    iconVol.classList.toggle('hidden', v === 0);
    iconMute.classList.toggle('hidden', v > 0);
  }
  function updateVolumeTooltip() {
    const rect = volumeSlider.getBoundingClientRect();
    const pct = volumeSlider.value / 100;
    const thumbPos = rect.left + rect.width * pct;
    const wrapRect = $('volumeWrap').getBoundingClientRect();
    volumeTooltip.style.left = (thumbPos - wrapRect.left) + 'px';
    volumeTooltip.textContent = Math.round(pct * 100) + '%';
  }
  volumeSlider.addEventListener('input', () => {
    const v = volumeSlider.value / 100;
    nativeVideo.muted = v === 0;
    nativeVideo.volume = v;
    updateVolumeIcon();
    updateVolumeTooltip();
    volumeTooltip.classList.add('visible');
    saveSettings();
  });
  volumeSlider.addEventListener('change', () => {
    setTimeout(() => volumeTooltip.classList.remove('visible'), 1000);
  });
  volumeSlider.addEventListener('mouseleave', () => {
    if (!volumeSlider.matches(':active')) volumeTooltip.classList.remove('visible');
  });
  muteBtn.addEventListener('click', () => {
    if (nativeVideo.muted || nativeVideo.volume === 0) {
      nativeVideo.muted = false;
      if (nativeVideo.volume === 0) nativeVideo.volume = 1;
    } else {
      nativeVideo.muted = true;
    }
    updateVolumeIcon();
    updateVolumeTooltip();
    volumeTooltip.classList.add('visible');
    setTimeout(() => volumeTooltip.classList.remove('visible'), 1000);
    saveSettings();
  });
  nativeVideo.addEventListener('volumechange', () => {
    volumeSlider.value = Math.round((nativeVideo.muted ? 0 : nativeVideo.volume) * 100);
    updateVolumeIcon();
  });

  // Шаг 2.3: iOS Safari не умеет фуллскрин контейнера — уходим на нативный
  // фуллскрин самого <video> (`webkitEnterFullscreen`); он не даёт
  // `fullscreenchange`, поэтому отдельно слушаем его события.
  function setFsIcon(fs) {
    iconFs.classList.toggle('hidden', fs);
    iconFsExit.classList.toggle('hidden', !fs);
  }
  function syncFsIcon() {
    setFsIcon(!!(document.fullscreenElement || document.webkitFullscreenElement));
  }
  function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      return;
    }
    const req = playerContainer.requestFullscreen || playerContainer.webkitRequestFullscreen;
    if (req) { Promise.resolve(req.call(playerContainer)).catch(() => {}); return; }
    if (nativeVideo.webkitEnterFullscreen) nativeVideo.webkitEnterFullscreen();
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', syncFsIcon);
  document.addEventListener('webkitfullscreenchange', syncFsIcon);
  nativeVideo.addEventListener('webkitbeginfullscreen', () => setFsIcon(true));
  nativeVideo.addEventListener('webkitendfullscreen', () => setFsIcon(false));

  // ============================================================
  //  Speed & Step
  // ============================================================
  function applyRate(rate) {
    userSpeed = rate;
    // Шаг 4.1: `load()` сбрасывает playbackRate к defaultPlaybackRate,
    // поэтому держим их синхронными — иначе скорость теряется при загрузке.
    try { nativeVideo.defaultPlaybackRate = rate; } catch {}
    if (!pointerDown || pointerDown.mode !== 'speed') nativeVideo.playbackRate = rate;
    speedOptions.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', parseFloat(b.dataset.speed) === rate);
    });
  }
  speedOptions.addEventListener('click', e => {
    const btn = e.target.closest('button[data-speed]');
    if (btn) { applyRate(parseFloat(btn.dataset.speed)); saveSettings(); }
  });

  function setStep(sec) {
    currentStep = sec;
    skipBackLabel.textContent = sec;
    skipFwdLabel.textContent = sec;
    stepOptions.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.step, 10) === sec);
    });
  }
  stepOptions.addEventListener('click', e => {
    const btn = e.target.closest('button[data-step]');
    if (btn) { setStep(parseInt(btn.dataset.step, 10)); saveSettings(); }
  });

  // ============================================================
  //  Settings Panel
  // ============================================================
  function toggleSettings(force) {
    settingsOpen = typeof force === 'boolean' ? force : !settingsOpen;
    settingsPanel.classList.toggle('hidden', !settingsOpen);
    if (settingsOpen) {
      playerContainer.classList.add('controls-visible');
      clearTimeout(controlsHideTimer);
    } else showControls();
  }
  settingsBtn.addEventListener('click', e => { e.stopPropagation(); toggleSettings(); });
  document.addEventListener('click', e => {
    if (settingsOpen && !e.target.closest('.settings-panel') && !e.target.closest('#settingsBtn')) toggleSettings(false);
  });
  settingsPanel.addEventListener('click', e => e.stopPropagation());

  async function copyText(text, btnElement, defaultText) {
    try {
      await navigator.clipboard.writeText(text);
      if (btnElement) {
        const original = defaultText || btnElement.textContent;
        btnElement.textContent = 'Скопировано!';
        setTimeout(() => btnElement.textContent = original, 2000);
      } else {
        showToast('Ссылка скопирована');
      }
    } catch {
      showToast('Не удалось скопировать', { error: true });
    }
  }

  copyLinkBtn.addEventListener('click', () => {
    const url = new URL(location.href);
    url.searchParams.set('embed', currentUrl);
    copyText(url.toString(), copyLinkBtnText, 'Скопировать ссылку');
  });

  copyInputBtn.addEventListener('click', () => {
    copyText(manualUrlInput.value);
  });

  // Шаг 1.2: после клика по «Скачать» снимаем фокус — иначе Space снова
  // срабатывает по ссылке и мешает паузе/воспроизведению.
  downloadBtn.addEventListener('click', () => setTimeout(() => downloadBtn.blur(), 0));
  
  manualUrlInput.addEventListener('input', () => {
    copyInputBtn.classList.toggle('hidden', !manualUrlInput.value.trim());
  });

  // ============================================================
  //  Quality Menu
  // ============================================================
  // Метка качества: NAME мастера, иначе группа аудио (audio1080/audio720/…),
  // иначе — привычный ряд по ширине кадра (2.4:1 даёт высоту 800/534/300).
  function qualityLabel(lv) {
    if (lv.name) return lv.name;
    const group = (lv.attrs && lv.attrs.AUDIO) || '';
    const m = String(group).match(/(\d{3,4})/);
    if (m) return m[1] + 'p';
    const w = lv.width || 0;
    const tiers = [[1900, '1080p'], [1200, '720p'], [900, '540p'],
                   [760, '480p'], [600, '360p'], [400, '240p']];
    for (const [min, label] of tiers) if (w >= min) return label;
    return lv.height ? lv.height + 'p'
                     : (lv.bitrate ? Math.round(lv.bitrate / 1000) + 'k' : '—');
  }

  function buildQualityMenu(hls, levels) {
    qualityOptions.innerHTML = '';
    const autoBtn = document.createElement('button');
    autoBtn.textContent = 'Auto';
    autoBtn.className = 'active';
    autoBtn.dataset.level = '-1';
    autoBtn.addEventListener('click', () => { hls.currentLevel = -1; setActiveLevel(-1); savePrefs({ level: 'Auto' }); });
    qualityOptions.appendChild(autoBtn);

    // Движок отдаёт по STREAM-INF на каждую аудиогруппу — уровни дублируются;
    // в меню оставляем по одному на метку.
    const seen = new Set();
    const items = [];
    levels.forEach((lv, i) => {
      const label = qualityLabel(lv);
      if (seen.has(label)) return;
      seen.add(label);
      items.push({ lv, i, label });
    });
    items.sort((a, b) => (b.lv.height || b.lv.bitrate || 0)
                       - (a.lv.height || a.lv.bitrate || 0));

    for (const { i, label } of items) {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.dataset.level = String(i);
      btn.addEventListener('click', () => { hls.currentLevel = i; setActiveLevel(i); savePrefs({ level: label }); });
      qualityOptions.appendChild(btn);
    }
    qualitySection.classList.toggle('hidden', items.length <= 1);
    // Шаг 4.3: вспоминаем выбранное качество этого тайтла.
    const saved = store.read(titleKey(), null);
    if (saved && saved.level && saved.level !== 'Auto') {
      const btn = Array.from(qualityOptions.querySelectorAll('button'))
        .find(b => b.textContent === saved.level && b.dataset.level !== '-1');
      if (btn) { hls.currentLevel = parseInt(btn.dataset.level, 10); setActiveLevel(btn.dataset.level); }
    }
  }
  function setActiveLevel(idx) {
    qualityOptions.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.level === String(idx));
    });
  }

  function audioTrackLabel(tr, i) {
    const named = audioNames[i];
    if (named && named.toLowerCase() !== 'delete') return named;
    return tr.name || tr.lang || ('Дорожка ' + (i + 1));
  }
  // Записи-«удалено» (служебный `delete` в данных движка) в меню не показываем:
  // это дорожки, которые убрал сам движок.
  function audioTrackHidden(i) {
    return (audioNames[i] || '').toLowerCase() === 'delete';
  }
  // Озвучки — это аудиодорожки потока (#EXT-X-MEDIA:TYPE=AUDIO), поэтому
  // меню показываем только когда доступных больше одной.
  function buildAudioMenu(hls, tracks) {
    audioOptions.innerHTML = '';
    const list = tracks || [];
    const visible = list.map((tr, i) => i).filter(i => !audioTrackHidden(i));
    if (visible.length <= 1) {
      audioSection.classList.add('hidden');
      return;
    }
    visible.forEach(i => {
      const btn = document.createElement('button');
      const label = audioTrackLabel(list[i], i);
      btn.textContent = label;
      btn.dataset.track = String(i);
      btn.addEventListener('click', () => { hls.audioTrack = i; setActiveAudio(i); savePrefs({ audio: label }); });
      audioOptions.appendChild(btn);
    });
    audioSection.classList.remove('hidden');
    // Шаг 4.3: вспоминаем выбранную озвучку этого тайтла.
    const savedAudio = (store.read(titleKey(), null) || {}).audio;
    const pick = savedAudio && Array.from(audioOptions.querySelectorAll('button'))
      .find(b => b.textContent === savedAudio);
    if (pick) { hls.audioTrack = parseInt(pick.dataset.track, 10); setActiveAudio(pick.dataset.track); }
    else setActiveAudio(hls.audioTrack);
  }
  function setActiveAudio(i) {
    audioOptions.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.track === String(i));
    });
  }

  // ============================================================
  //  U26: Навигация серий (вариант D)
  //  В ссылке — только id тайтла (&cid=) и база catalog-api (&capi=);
  //  список сезонов/серий страница запрашивает сама. Подписанные ссылки
  //  серий меняются от запроса к запросу, поэтому текущую серию определяем
  //  по номерам (&sea=/&epi=), а не сопоставлением URL.
  // ============================================================
  function pickEpisodeUrl(episode) {
    const variants = ((episode && episode.episodeVariants) || [])
      .filter(v => v && v.filepath);
    if (!variants.length) return '';
    let best = variants[0];
    for (const v of variants) {
      if ((+v.duration || 0) > (+best.duration || 0)) best = v;
    }
    return best.filepath || '';
  }

  function buildEpisodesIndex(list) {
    const bySeason = {};
    (list || []).forEach(episode => {
      if (!episode) return;
      const season = (episode.season && +episode.season.order) || 1;
      const number = +episode.order || 0;
      const url = pickEpisodeUrl(episode);
      if (!number || !url) return;
      (bySeason[season] || (bySeason[season] = [])).push({
        ep: number, title: String(episode.title || ''), url,
      });
    });
    Object.keys(bySeason).forEach(s => bySeason[s].sort((a, b) => a.ep - b.ep));
    const seasons = Object.keys(bySeason).map(Number).sort((a, b) => a - b);
    return { seasons, bySeason };
  }

  function seasonEpisodes(season) {
    return (episodesIndex && episodesIndex.bySeason[season]) || [];
  }

  function flatEpisodes() {
    const out = [];
    if (episodesIndex) {
      episodesIndex.seasons.forEach(s => {
        seasonEpisodes(s).forEach(item =>
          out.push({ season: s, ep: item.ep, url: item.url }));
      });
    }
    return out;
  }

  function renderEpisodeNav() {
    if (!episodesIndex) return;
    const list = seasonEpisodes(curSeason);
    const flat = flatEpisodes();
    const pos = flat.findIndex(x => x.season === curSeason && x.ep === curEpisode);
    epNav.classList.remove('hidden');
    prevEpBtn.disabled = pos <= 0;
    nextEpBtn.disabled = pos < 0 || pos >= flat.length - 1;

    seasonOptions.innerHTML = '';
    episodesIndex.seasons.forEach(s => {
      const b = document.createElement('button');
      b.textContent = 'Сезон ' + s;
      b.className = s === curSeason ? 'active' : '';
      b.addEventListener('click', () => {
        curSeason = s;
        const first = seasonEpisodes(s)[0];
        if (first) {
          playEpisode(first.ep);          // сразу открываем первую серию сезона
        } else {
          curEpisode = null;
          renderEpisodeNav();
        }
      });
      seasonOptions.appendChild(b);
    });
    seasonSection.classList.toggle('hidden', episodesIndex.seasons.length <= 1);

    episodeOptions.innerHTML = '';
    list.forEach(item => {
      const b = document.createElement('button');
      b.textContent = String(item.ep);
      if (item.title) b.title = item.title;
      b.className = item.ep === curEpisode ? 'active' : '';
      b.addEventListener('click', () => playEpisode(item.ep));
      episodeOptions.appendChild(b);
    });
    episodeSection.classList.toggle('hidden', !list.length);
  }

  // Переключение серии без выхода из плеера: подменяем `embed` в адресной
  // строке (чтобы «Скопировать ссылку» отдавала текущую серию) и играем поток.
  function playEpisode(episode) {
    const item = seasonEpisodes(curSeason).find(x => x.ep === episode);
    if (!item || !item.url) return;
    curEpisode = episode;
    try {
      const u = new URL(location.href);
      u.searchParams.set('embed', item.url);
      u.searchParams.set('sea', String(curSeason));
      u.searchParams.set('epi', String(episode));
      history.replaceState(null, '', u.toString());
    } catch (e) {}
    manualUrlInput.value = item.url;
    loadFromUrl(item.url);
    renderEpisodeNav();
    if (settingsOpen) toggleSettings(false);
  }

  // Соседняя серия: переходим через границу сезонов (последняя серия сезона
  // → первая следующего).
  function stepEpisode(delta) {
    const flat = flatEpisodes();
    const pos = flat.findIndex(x => x.season === curSeason && x.ep === curEpisode);
    if (pos < 0) return;
    const next = flat[pos + delta];
    if (!next) return;
    curSeason = next.season;
    playEpisode(next.ep);
  }

  async function loadEpisodeNav() {
    if (!catalogApi || !contentId) return;
    try {
      const url = catalogApi + '/episodes?content-id=' +
                  encodeURIComponent(contentId);
      const r = await fetch(url, { credentials: 'omit', cache: 'no-store' });
      if (!r.ok) return;
      const list = await r.json();
      if (!Array.isArray(list) || !list.length) return;
      const index = buildEpisodesIndex(list);
      if (!index.seasons.length) return;
      episodesIndex = index;
      if (curSeason == null || !index.bySeason[curSeason]) {
        curSeason = index.seasons[0];
      }
      const list2 = seasonEpisodes(curSeason);
      if (curEpisode == null || !list2.some(x => x.ep === curEpisode)) {
        curEpisode = list2.length ? list2[0].ep : null;
      }
      renderEpisodeNav();
    } catch (e) {
      // API недоступен — навигации просто нет, воспроизведение не трогаем.
    }
  }

  prevEpBtn.addEventListener('click', () => stepEpisode(-1));
  nextEpBtn.addEventListener('click', () => stepEpisode(1));

  // ============================================================
  //  HLS / Source Loading
  // ============================================================
  // Атрибуты тега HLS. Наивный split(',') ломается на запятой внутри
  // кавычек (например CODECS="avc1.640028,mp4a.40.2") — отсюда падал
  // разбор мастера и «бесконечная загрузка» (§8, ревизия v2.37.46).
  function parseHlsAttrs(spec) {
    const attrs = {};
    const re = /([A-Z0-9-]+)=("[^"]*"|[^,]*)/gi;
    let m;
    while ((m = re.exec(spec))) {
      let v = m[2];
      if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
      attrs[m[1].toUpperCase()] = v.trim();
    }
    return attrs;
  }

  async function loadHlsWithProbing(inputUrl) {
    let text = null;
    try {
      // §13: проба мастера не должна «вешаться» — иначе страница ждёт вечно.
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(inputUrl,
        { credentials: 'omit', cache: 'no-store', signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) text = await r.text();
    } catch (e) {}
    if (!text) return { masterUrl: inputUrl };

    const isMedia = !/#EXT-X-STREAM-INF:/i.test(text);
    let variants = [];
    
    if (!isMedia) {
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].startsWith('#EXT-X-STREAM-INF:')) {
          const attrs = parseHlsAttrs(lines[i].slice(18));
          for (let j = i + 1; j < lines.length; j++) {
            if (lines[j] && !lines[j].startsWith('#')) {
              variants.push({
                url: new URL(lines[j].trim(), inputUrl).toString(),
                bandwidth: parseInt(attrs.BANDWIDTH) || 0,
                width: attrs.RESOLUTION ? parseInt(attrs.RESOLUTION.split('x')[0]) : 0,
                height: attrs.RESOLUTION ? parseInt(attrs.RESOLUTION.split('x')[1]) : 0,
                name: attrs.NAME || '',
              });
              break;
            }
          }
        }
      }
    }

    if (variants.length > 1 || (isMedia && !detectQualityInUrl(inputUrl))) {
      return { masterUrl: inputUrl };
    }

    const baseQ = isMedia ? detectQualityInUrl(inputUrl) : detectQualityInUrl(variants[0].url);
    if (!baseQ) return { masterUrl: inputUrl };

    const single = isMedia ? { url: inputUrl, bandwidth: 0, width: 0, height: 0 } : variants[0];
    const COMMON_Q = ['144','240','360','480','540','576','720','1080','1440','2160'];
    const RES_MAP = {'144':[256,144],'240':[426,240],'360':[640,360],'480':[854,480],'540':[960,540],'576':[1024,576],'720':[1280,720],'1080':[1920,1080],'1440':[2560,1440],'2160':[3840,2160]};
    
    setLoading(true);
    const probed = [{ ...single, quality: baseQ }];
    await Promise.all(COMMON_Q.filter(q => q !== baseQ).map(async q => {
      let url = single.url;
      url = url.replace(new RegExp(`/${baseQ}p/`, 'g'), `/${q}p/`)
               .replace(new RegExp(`__${baseQ}p\\.`, 'g'), `__${q}p.`)
               .replace(new RegExp(`/${baseQ}\\.m3u8`, 'g'), `/${q}.m3u8`);
      if (url === single.url) return;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 2000);
      try {
        const r = await fetch(url, { signal: ctrl.signal });
        if (r.ok && (await r.text()).startsWith('#EXTM3U')) {
          const [w, h] = RES_MAP[q] || [0, 0];
          probed.push({ url, quality: q, width: w, height: h, bandwidth: 1000000 });
        }
      } catch {}
      clearTimeout(t);
    }));

    if (probed.length <= 1) return { masterUrl: inputUrl };

    probed.sort((a, b) => parseInt(b.quality) - parseInt(a.quality));
    let synth = '#EXTM3U\n#EXT-X-VERSION:3\n';
    probed.forEach(v => {
      synth += `#EXT-X-STREAM-INF:BANDWIDTH=${v.bandwidth || 1000000},RESOLUTION=${v.width}x${v.height},NAME=${v.quality}p\n${v.url}\n`;
    });
    const blob = new Blob([synth], { type: 'application/vnd.apple.mpegurl' });
    currentBlobUrl = URL.createObjectURL(blob);
    return { masterUrl: currentBlobUrl };
  }

  function detectQualityInUrl(url) {
    const m = url.match(/\/(\d{3,4})p\//i) || url.match(/__(\d{3,4})p\./i);
    return m ? m[1] : null;
  }

  function whenHlsReady(cb) {
    if (window.Hls) return cb();
    const iv = setInterval(() => { if (window.Hls) { clearInterval(iv); cb(); } }, 100);
  }

  async function playHls(url) {
    stopPlayback();
    setLoading(true);
    showKind('video');
    let masterUrl = url;
    try {
      ({ masterUrl } = await loadHlsWithProbing(url));
    } catch (e) {
      masterUrl = url;  // сбой пробы не должен ломать воспроизведение
    }
    whenHlsReady(() => {
      if (window.Hls.isSupported()) {
        // §14: у VeoVeo звук идёт отдельными аудиодорожками (#EXT-X-MEDIA
        // TYPE=AUDIO). После перемотки hls.js иногда не подхватывает их
        // заново — расширяем допуски по «дырам» буфера и неточной границе
        // фрагмента, чтобы seek реже оставлял поток без звука/видео.
        const hls = new window.Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferHole: 0.5,
          maxFragLookUpTolerance: 0.25,
        });
        currentHls = hls;
        let gotFragment = false;
        // §13: мастер может разобраться (качества/озвучки видны), а фрагменты
        // источник отдаёт 4xx — тогда `duration` не появится. Если за 12 с ни
        // один фрагмент не загрузился, уходим на запасной iframe (страж — на
        // случай, когда hls.js не отдаёт fatal с кодом ответа).
        const guard = setTimeout(() => {
          if (!gotFragment && currentHls === hls) switchToFallback();
        }, 12000);
        hls.on(window.Hls.Events.FRAG_LOADED, () => { gotFragment = true; });
        hls.loadSource(masterUrl);
        hls.attachMedia(nativeVideo);
        hls.on(window.Hls.Events.MANIFEST_PARSED, (_, data) => {
          setLoading(false);
          // Шаг 3.1: автостарт, но с большой кнопкой, если WebView запретил play().
          if (typeof autoplay === 'function') autoplay();
          else nativeVideo.play().catch(() => {});
          if (data?.levels) buildQualityMenu(hls, data.levels);
          buildAudioMenu(hls, hls.audioTracks);
        });
        hls.on(window.Hls.Events.AUDIO_TRACKS_UPDATED, (_, data) => {
          buildAudioMenu(hls, (data && data.audioTracks) || hls.audioTracks);
        });
        hls.on(window.Hls.Events.AUDIO_TRACK_SWITCHED,
               () => setActiveAudio(hls.audioTrack));
        const onHlsError = makeHlsErrorHandler(hls, () => clearTimeout(guard));
        hls.on(window.Hls.Events.ERROR, (_, data) => onHlsError(data));
      } else {
        playHlsNative(url);
      }
    });
  }

  // §13: источник/CDN ограничил прямой поток (фрагменты отдают 4xx) —
  // открываем запасной iframe источника. Показ важнее отсутствия рекламы;
  // срабатывает один раз на ссылку. Без запасного URL просто снимаем спиннер.
  function switchToFallback() {
    if (!fallbackUrl || fallbackUsed) {
      // Шаг 3.2: фолбэка нет — показываем оверлей с действиями, а не «тишину».
      showToast('Не удалось воспроизвести поток', { error: true, retry: true });
      return;
    }
    fallbackUsed = true;
    showToast('Источник ограничил прямой поток — открываю плеер источника');
    playEmbed(fallbackUrl);
  }

  // Ошибки hls.js: не пугаем тостом на каждом fatal-событии, а сначала
  // пробуем восстановиться. Сеть — `startLoad` (догрузка), медиа —
  // `recoverMediaError`; тост — только когда попытки исчерпаны.
  // §13: HTTP 4xx (фрагменты/мастер недоступны) ретраить бессмысленно —
  // сразу отдаём управление запасному iframe источника.
  function makeHlsErrorHandler(hls, onDone) {
    let netRetries = 0, mediaRetries = 0;
    const H = window.Hls;
    const done = () => { if (onDone) onDone(); };
    return data => {
      if (!data || !data.fatal) return;
      const code = data.response && data.response.code;
      if (fallbackUrl && code >= 400 && code < 500) {
        done(); switchToFallback(); return;
      }
      if (data.type === H.ErrorTypes.NETWORK_ERROR && netRetries++ < 3) {
        hls.startLoad();
        return;
      }
      if (data.type === H.ErrorTypes.MEDIA_ERROR && mediaRetries++ < 2) {
        hls.recoverMediaError();
        return;
      }
      done();
      if (fallbackUrl) { switchToFallback(); return; }
      setLoading(false);
      showToast('Ошибка HLS потока', { error: true, retry: true });
      try { hls.destroy(); } catch (e) {}
    };
  }

  // §14: перемотка на источнике с отдельными аудиодорожками (#EXT-X-MEDIA
  // TYPE=AUDIO; так устроен VeoVeo) иногда «залипает»: после seek
  // видеопоток и аудиодорожка перезагружаются несинхронно, и
  // воспроизведение не стартует — ни видео, ни звук не декодируются.
  // Лечим сторожем после перемотки: нет прогресса — по очереди
  // перевыбираем аудиодорожку, догружаем поток (`startLoad`) и
  // восстанавливаем медиа (`recoverMediaError`). Без перемотки и при
  // паузе сторож молчит, поэтому штатное воспроизведение не трогаем.
  let seekWatchdog = null;   // id таймера сторожа
  let seekRecoverLevel = 0;  // 0 — перевыбор звука, 1 — startLoad, 2 — recover

  function clearSeekWatchdog() {
    if (seekWatchdog !== null) { clearTimeout(seekWatchdog); seekWatchdog = null; }
    seekRecoverLevel = 0;
  }

  // hls.js игнорирует повторную установку той же дорожки, поэтому сбрасываем
  // выбор (`-1` — «без звука») и сразу возвращаем прежнюю: это заставляет
  // перечитать аудиоплейлист-часть, откуда и пропадал звук.
  function reattachAudioTrack(hls) {
    if (!hls || typeof hls.audioTrack !== 'number') return;
    const idx = hls.audioTrack;
    if (idx < 0 || !hls.audioTracks || hls.audioTracks.length <= 1) return;
    hls.audioTrack = -1;
    hls.audioTrack = idx;
  }

  function armSeekWatchdog(hls) {
    if (seekWatchdog !== null) { clearTimeout(seekWatchdog); seekWatchdog = null; }
    if (!hls || nativeVideo.paused) return;
    const startTime = nativeVideo.currentTime;
    seekWatchdog = setTimeout(() => {
      seekWatchdog = null;
      if (!hls || hls !== currentHls || nativeVideo.paused) return;
      const moved = nativeVideo.currentTime - startTime;
      if (moved > 0.4 && nativeVideo.readyState >= 3) { seekRecoverLevel = 0; return; }
      if (seekRecoverLevel === 0) {
        reattachAudioTrack(hls);
      } else if (seekRecoverLevel === 1) {
        try { hls.startLoad(); } catch (e) {}
      } else if (seekRecoverLevel === 2) {
        try { hls.recoverMediaError(); } catch (e) {}
      } else {
        return;  // попытки исчерпаны — дальше обработчик fatal-ошибок
      }
      seekRecoverLevel++;
      armSeekWatchdog(hls);
    }, 3000);
  }

  // Слушатели вешаем один раз: сторож работает с текущим (`currentHls`)
  // потоком, поэтому переживает многократные playHls без накопления.
  nativeVideo.addEventListener('seeking', () => clearSeekWatchdog());
  nativeVideo.addEventListener('seeked', () => armSeekWatchdog(currentHls));
  nativeVideo.addEventListener('pause', () => clearSeekWatchdog());

  function playHlsNative(url) {
    const myId = ++playbackId;
    nativeVideo.src = url;
    nativeVideo.addEventListener('loadedmetadata', () => {
      if (myId === playbackId) {
        setLoading(false);
        // Шаг 3.1: автостарт, иначе — большая кнопка (WebView блокирует play()).
        if (typeof autoplay === 'function') autoplay();
        else nativeVideo.play().catch(()=>{});
      }
    }, { once: true });
    // §13: нативный HLS (Safari) не отдал поток — уходим на запасной iframe.
    nativeVideo.addEventListener('error', () => {
      if (myId !== playbackId) return;
      if (fallbackUrl) { switchToFallback(); }
      else { setLoading(false); showToast('Ошибка HLS потока', { error: true, retry: true }); }
    }, { once: true });
  }

  // U31: прямой MP4 может не отдаться вовсе — CDN отдаёт 4xx (анти-хотлинк)
  // или просто «молчит» по тайм-ауту (гео-ограничение). Тогда уходим на
  // запасной iframe источника (§13): `error` ловит отказ, сторож — тишину.
  function playMp4(url) {
    stopPlayback();
    setLoading(true);
    showKind('video');
    const myId = ++playbackId;
    nativeVideo.src = url;
    nativeVideo.addEventListener('loadedmetadata', () => {
      if (myId !== playbackId) return;
      if (mp4Guard !== null) { clearTimeout(mp4Guard); mp4Guard = null; }
      setLoading(false);
      // Шаг 3.1: автостарт, иначе — большая кнопка (WebView блокирует play()).
      if (typeof autoplay === 'function') autoplay();
      else nativeVideo.play().catch(()=>{});
    }, { once: true });
    nativeVideo.addEventListener('error', () => {
      if (myId !== playbackId) return;
      if (mp4Guard !== null) { clearTimeout(mp4Guard); mp4Guard = null; }
      if (fallbackUrl) { switchToFallback(); }
      else { setLoading(false); showToast('Не удалось открыть видео', { error: true, retry: true }); }
    }, { once: true });
    // Некоторые CDN не отдают ошибку, а держат соединение: `error` не придёт,
    // и спиннер висел бы вечно. Если за 12 с метаданные не появились — фолбэк.
    mp4Guard = setTimeout(() => {
      mp4Guard = null;
      if (myId !== playbackId || nativeVideo.readyState >= 1) return;
      if (fallbackUrl) { switchToFallback(); }
      else { setLoading(false); showToast('Видео недоступно', { error: true, retry: true }); }
    }, 12000);
  }

  function playEmbed(url) {
    stopPlayback();
    showKind('iframe');
    playerFrame.src = url;
  }

  function showKind(kind) {
    playerContainer.classList.remove('hidden');
    if (kind === 'video') {
      playerContainer.classList.remove('embed-mode');
      nativeVideo.classList.remove('hidden');
      playerFrame.classList.add('hidden');
    } else {
      playerContainer.classList.add('embed-mode');
      nativeVideo.classList.add('hidden');
      playerFrame.classList.remove('hidden');
      setLoading(false);
      playerContainer.classList.remove('controls-visible', 'paused', 'locked');
      if (settingsOpen) toggleSettings(false);
    }
  }

  function stopPlayback() {
    clearSeekWatchdog();
    hideErrorOverlay();
    hideBigPlay();
    hideResume(false);
    pendingResumeTime = null;
    resumeOfferedFor = -1;
    if (mp4Guard !== null) { clearTimeout(mp4Guard); mp4Guard = null; }
    if (currentHls) { try { currentHls.destroy(); } catch {} currentHls = null; }
    if (currentBlobUrl) { try { URL.revokeObjectURL(currentBlobUrl); } catch {} currentBlobUrl = null; }
    try { nativeVideo.pause(); nativeVideo.removeAttribute('src'); nativeVideo.load(); } catch {}
    try { playerFrame.src = 'about:blank'; } catch {}
    qualitySection.classList.add('hidden');
    audioSection.classList.add('hidden');
    playerContainer.classList.remove('embed-mode');
  }

  function loadFromUrl(rawUrl) {
    const url = normalizeUrl(rawUrl);
    let parsed;
    try { parsed = new URL(url); } catch { return showToast('Некорректная ссылка', { error: true }); }
    currentUrl = url;
    fallbackUsed = false;  // новая ссылка — фолбэк снова доступен (§13)
    manualUrlInput.value = rawUrl;
    copyInputBtn.classList.remove('hidden');
    
    const path = parsed.pathname.toLowerCase();
    if (/\.m3u8$/i.test(path)) playHls(url);
    else if (/\.(mp4|webm|ogg|mkv|m4v|mov)$/i.test(path)) playMp4(url);
    else playEmbed(url);
  }

  manualForm.addEventListener('submit', e => {
    e.preventDefault();
    const raw = manualUrlInput.value.trim();
    if (!raw) return;
    try {
      const u = new URL(location.href);
      u.searchParams.set('embed', raw);
      history.replaceState(null, '', u.toString());
    } catch {}
    loadFromUrl(raw);
  });

  // ============================================================
  //  Pointer Interactions
  // ============================================================
  function handlePointerDown(e) {
    if (isLocked || e.button !== 0) return;
    if (e.target.closest('.controls') || e.target.closest('.settings-panel') || e.target.closest('.lock-btn') || e.target.closest('.dl-btn') || e.target.closest('.big-play') || e.target.closest('.error-overlay')) return;
    if (nativeVideo.classList.contains('hidden')) return; // iframe mode

    const rect = playerContainer.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    pointerDown = {
      startX: e.clientX,
      startY: e.clientY,
      startTime: Date.now(),
      xRatio: x,
      yRatio: y,
      mode: 'none',
      targetSpeed: 1
    };

    if (x < 0.33) pointerDown.mode = 'speed';
    else if (x > 0.66) pointerDown.mode = 'speed';
    else pointerDown.mode = 'center';

    if (clickTimeout) clearTimeout(clickTimeout);
  }

  function handlePointerMove(e) {
    if (!pointerDown) return;
    const dx = e.clientX - pointerDown.startX;
    const dy = e.clientY - pointerDown.startY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      if (pointerDown.mode === 'speed') {
        const baseSpeed = 2.0;
        let rate = baseSpeed;
        
        if (pointerDown.xRatio < 0.33) {
          rate = Math.max(0.5, Math.min(1, baseSpeed + (dx / 200)));
        } else {
          rate = Math.max(1, Math.min(4, baseSpeed + (dx / 200)));
        }

        if (!pointerDown.isSpeeding) {
          pointerDown.isSpeeding = true;
          if (nativeVideo.paused) nativeVideo.play().catch(()=>{});
          nativeVideo.playbackRate = rate;
          speedDragIndicator.classList.remove('hidden');
          playerContainer.classList.add('controls-visible');
        }
        
        pointerDown.targetSpeed = rate;
        nativeVideo.playbackRate = rate;
        speedDragText.textContent = rate.toFixed(1) + '×';
        
        const pct = ((rate - 0.5) / 3.5) * 100;
        speedDragBar.style.width = pct + '%';
        
      } else if (pointerDown.mode === 'center') {
        if (!pointerDown.isHiding) {
          pointerDown.isHiding = true;
          isPausedByDrag = !nativeVideo.paused;
          if (isPausedByDrag) nativeVideo.pause();
          playerContainer.classList.remove('controls-visible');
        }
      }
    }
  }

  function handlePointerUp(e) {
    if (!pointerDown) return;
    
    const dt = Date.now() - pointerDown.startTime;
    const dx = e.clientX - pointerDown.startX;
    
    if (pointerDown.mode === 'speed' && pointerDown.isSpeeding) {
      nativeVideo.playbackRate = userSpeed;
      speedDragIndicator.classList.add('hidden');
    }
    if (pointerDown.mode === 'center' && pointerDown.isHiding) {
      if (isPausedByDrag) nativeVideo.play().catch(()=>{});
    }

    const mode = pointerDown.mode;
    const isDrag = Math.abs(dx) > 10;
    pointerDown = null;

    if (isDrag) return;

    if (dt < 300) {
      if (clickTimeout) clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => {
        if (mode === 'center') togglePlay();
      }, 250);
    }
  }

  function handleDoubleClick(e) {
    if (isLocked) return;
    if (e.target.closest('.controls') || e.target.closest('.settings-panel') || e.target.closest('.lock-btn') || e.target.closest('.dl-btn') || e.target.closest('.big-play') || e.target.closest('.error-overlay')) return;
    if (nativeVideo.classList.contains('hidden')) return;
    
    if (clickTimeout) clearTimeout(clickTimeout);

    const rect = playerContainer.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;

    if (x < 0.33) skipBy(-currentStep);
    else if (x > 0.66) skipBy(currentStep);
    else toggleFullscreen();
  }

  playerContainer.addEventListener('pointerdown', handlePointerDown);
  playerContainer.addEventListener('pointermove', handlePointerMove);
  playerContainer.addEventListener('pointerup', handlePointerUp);
  playerContainer.addEventListener('pointercancel', handlePointerUp);
  playerContainer.addEventListener('dblclick', handleDoubleClick);

  // ============================================================
  //  Keyboard
  // ============================================================
  document.addEventListener('keydown', e => {
    if (document.activeElement.tagName === 'INPUT' || isLocked) return;
    if (playerContainer.classList.contains('embed-mode')) return;
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        if (!spaceHeld) {
          spaceHeld = true;
          spaceTriggeredSpeed = false;
          spaceHoldTimer = setTimeout(() => {
            if (spaceHeld && !nativeVideo.paused) {
              nativeVideo.playbackRate = 2;
              speedDragIndicator.classList.remove('hidden');
              speedDragText.textContent = '2.0×';
              speedDragBar.style.width = '42%';
              spaceTriggeredSpeed = true;
            }
          }, 220);
        }
        break;
      case 'KeyM': e.preventDefault(); muteBtn.click(); break;
      case 'KeyF': e.preventDefault(); toggleFullscreen(); break;
      case 'ArrowLeft': e.preventDefault(); skipBy(-currentStep); break;
      case 'ArrowRight': e.preventDefault(); skipBy(currentStep); break;
    }
  });
  document.addEventListener('keyup', e => {
    if (document.activeElement.tagName === 'INPUT' || isLocked) return;
    if (playerContainer.classList.contains('embed-mode')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (spaceHeld) {
        spaceHeld = false;
        clearTimeout(spaceHoldTimer);
        if (spaceTriggeredSpeed) {
          nativeVideo.playbackRate = userSpeed;
          speedDragIndicator.classList.add('hidden');
        } else {
          togglePlay();
        }
      }
    }
  });

  // ============================================================
  //  Шаг 4: память настроек, позиции и выбранных дорожек
  //  (localStorage, всё в try/catch — приватный режим не ломает плеер).
  // ============================================================
  const store = (() => {
    const PREFIX = 'rfilms.';
    let ok = true;
    try {
      localStorage.setItem(PREFIX + '__t', '1');
      localStorage.removeItem(PREFIX + '__t');
    } catch { ok = false; }
    const read = (key, fallback) => {
      if (!ok) return fallback;
      try {
        const raw = localStorage.getItem(PREFIX + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    };
    const write = (key, val) => {
      if (!ok) return;
      try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); } catch {}
    };
    const remove = key => {
      if (!ok) return;
      try { localStorage.removeItem(PREFIX + key); } catch {}
    };
    // 4.4: чистим позиции старше TTL и битые записи.
    const prune = (ttlMs) => {
      if (!ok) return;
      const now = Date.now();
      const keys = [];
      try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); }
      catch { return; }
      keys.forEach(k => {
        if (!k || k.indexOf(PREFIX + 'pos.') !== 0) return;
        try {
          const v = JSON.parse(localStorage.getItem(k));
          if (!v || typeof v.at !== 'number' || now - v.at > ttlMs) localStorage.removeItem(k);
        } catch { try { localStorage.removeItem(k); } catch {} }
      });
    };
    return { read, write, remove, prune };
  })();

  const POS_TTL = 30 * 24 * 3600 * 1000;  // 4.4: позиция живёт 30 дней

  // 4.1: настройки (скорость, шаг, громкость, ambient).
  function saveSettings() {
    store.write('settings', {
      speed: userSpeed,
      step: currentStep,
      volume: nativeVideo.volume,
      muted: nativeVideo.muted,
      ambient: ambientToggle.checked,
    });
  }
  function restoreSettings() {
    const s = store.read('settings', null);
    if (!s || typeof s !== 'object') return;
    if (typeof s.step === 'number') setStep(s.step);
    if (typeof s.speed === 'number') applyRate(s.speed);
    if (typeof s.volume === 'number') nativeVideo.volume = Math.min(1, Math.max(0, s.volume));
    if (typeof s.muted === 'boolean') nativeVideo.muted = s.muted;
    // Не полагаемся на событие `volumechange` — синхронизируем ползунок явно.
    volumeSlider.value = Math.round((nativeVideo.muted ? 0 : nativeVideo.volume) * 100);
    updateVolumeIcon();
    if (s.ambient === true) { ambientToggle.checked = true; startAmbient(); }
  }

  // Ключ позиции/предпочтений: сериал — по id движка + сезон/серия,
  // иначе — по хэшу прямой ссылки. Стабилен между сессиями.
  function urlHash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function titleKey() {
    if (contentId) return 'pref.' + contentId;
    if (currentUrl) return 'pref.' + urlHash(currentUrl);
    return '';
  }
  function posKey() {
    if (contentId) return 'pos.' + contentId + '.' + (curSeason || 0) + '.' + (curEpisode || 0);
    if (currentUrl) return 'pos.' + urlHash(currentUrl);
    return '';
  }
  // 4.3: помним выбранное качество/озвучку по тайтлу.
  function savePrefs(patch) {
    const key = titleKey();
    if (!key) return;
    const cur = store.read(key, null);
    store.write(key, Object.assign(cur && typeof cur === 'object' ? cur : {}, patch));
  }

  // 4.2: сохранение позиции (не чаще раза в 5 с; при уходе — сразу).
  let lastPosSave = 0;
  let pendingResumeTime = null;
  let resumeTimer = null;

  function hideResume(dropPoint) {
    resumePill.classList.add('hidden');
    clearTimeout(resumeTimer);
    resumeTimer = null;
    if (dropPoint) { const k = posKey(); if (k) store.remove(k); }
  }
  function savePosition(force) {
    // Пока висит плашка, выбор ещё не сделан — не затираем точку.
    if (!resumePill.classList.contains('hidden')) return;
    if (nativeVideo.classList.contains('hidden')) return;
    const key = posKey();
    const dur = nativeVideo.duration;
    if (!key || !isFinite(dur) || dur <= 0) return;
    const now = Date.now();
    if (!force && now - lastPosSave < 5000) return;
    lastPosSave = now;
    const t = nativeVideo.currentTime;
    if (t < 10 || t > dur - 15) { store.remove(key); return; }
    store.write(key, { t, d: dur, at: now });
  }
  // Плашку показываем один раз на запуск воспроизведения.
  let resumeOfferedFor = -1;
  function maybeOfferResume() {
    if (resumeOfferedFor === playbackId) return;
    resumeOfferedFor = playbackId;
    if (nativeVideo.classList.contains('hidden')) return;
    const key = posKey();
    if (!key) return;
    const entry = store.read(key, null);
    if (!entry || typeof entry.t !== 'number') return;
    if (typeof entry.at === 'number' && Date.now() - entry.at > POS_TTL) { store.remove(key); return; }
    const dur = nativeVideo.duration;
    if (isFinite(dur) && dur > 0 && entry.t > dur - 15) { store.remove(key); return; }
    if (entry.t < 10) return;
    pendingResumeTime = entry.t;
    resumeBtn.textContent = '▶ Продолжить ' + formatTime(entry.t);
    resumePill.classList.remove('hidden');
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => hideResume(true), 9000);
  }
  resumeBtn.addEventListener('click', () => {
    if (pendingResumeTime != null) seekToTime(pendingResumeTime);
    hideResume(false);
  });
  resumeCloseBtn.addEventListener('click', () => hideResume(true));
  nativeVideo.addEventListener('loadedmetadata', maybeOfferResume);
  // Шаг 4.1: после загрузки источника возвращаем выбранную скорость
  // (некоторые движки сбрасывают её при смене `src`).
  nativeVideo.addEventListener('loadedmetadata', () => {
    try { nativeVideo.playbackRate = userSpeed; } catch {}
  });
  nativeVideo.addEventListener('timeupdate', () => savePosition(false));
  nativeVideo.addEventListener('pause', () => savePosition(true));
  nativeVideo.addEventListener('ended', () => { const k = posKey(); if (k) store.remove(k); });
  window.addEventListener('pagehide', () => savePosition(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(true); });

  // ============================================================
  //  Init
  // ============================================================
  (function init() {
    setStep(10);
    updateVolumeIcon();
    // Шаг 4: восстанавливаем настройки и подчищаем устаревшие позиции.
    restoreSettings();
    store.prune(POS_TTL);
    
    const params = new URLSearchParams(location.search);
    const embed = params.get('embed');
    const audio = params.get('audio');
    const fallback = params.get('fallback');
    if (audio) audioNames = audio.split('|');
    if (fallback) fallbackUrl = fallback;  // запасной iframe источника (§13)
    // Шаг 1.1: заголовок тайтла из `&title=` (бот уже кладёт «Название — Озвучка — S1E2»).
    const pageTitle = (params.get('title') || '').trim();
    if (pageTitle) {
      document.title = pageTitle + ' — R·Films';
      titleBar.textContent = pageTitle;
      titleBar.classList.remove('hidden');
    }
    // Шаг 1.2: кнопка «Скачать» — только для прямого потока (`&download=`).
    // `.m3u8` в download бот не кладёт (`make_stream` это запрещает), но
    // подстраховываемся здесь той же проверкой, что `is_hls` в боте.
    const download = params.get('download');
    if (download && !/\.m3u8(\?|#|$)/i.test(download)) {
      downloadBtn.href = download;
      downloadBtn.classList.remove('hidden');
    }
    // U26: навигация серий (вариант D) — id тайтла, база catalog-api и
    // текущие сезон/серия; список серий подтянет `loadEpisodeNav`.
    const cid = params.get('cid');
    const capi = params.get('capi');
    if (cid) contentId = cid;
    if (capi) catalogApi = capi.replace(/\/+$/, '');
    const sea = parseInt(params.get('sea'), 10);
    const epi = parseInt(params.get('epi'), 10);
    if (sea > 0) curSeason = sea;
    if (epi > 0) curEpisode = epi;
    if (embed) {
      manualUrlInput.value = embed;
      copyInputBtn.classList.remove('hidden');
      loadFromUrl(embed);
    }
    if (contentId && catalogApi) loadEpisodeNav();
  })();

})();
</script>
</body>
</html>
