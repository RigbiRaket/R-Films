<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>R·Films Player</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08090c;
    --panel: #14161c;
    --line: #ffffff18;
    --text: #f5f6f8;
    --muted: #a3a8b4;
    --accent: #6b8cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px 22px 26px;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .brand {
    font-weight: 760;
    font-size: 15px;
    display: flex;
    gap: 9px;
    align-items: center;
  }
  .brand-mark {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: linear-gradient(135deg, #7b97ff, #4467d8);
    box-shadow: 0 3px 12px #4c6fff55;
  }
  .brand-mark svg { width: 15px; height: 15px; }
  .caption {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 55vw;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    max-width: 1380px;
    margin: 0 auto;
    background: #000;
    aspect-ratio: 16/9;
    min-height: 240px;
    max-height: calc(100vh - 120px);
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 18px 60px #0008;
  }
  .player-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
  .info {
    max-width: 1380px;
    margin: 0 auto;
    padding: 18px 2px 0;
  }
  .info h1 {
    font-size: 18px;
    line-height: 1.35;
    margin: 0 0 8px;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .info .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid #ffffff1b;
    background: #15171d;
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    color: #d7d9e0;
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
    transition: background .15s;
  }
  .btn:hover { background: #20232b; }
  .btn.primary { background: var(--accent); color: white; border-color: transparent; }
  .btn.primary:hover { background: #7b97ff; }
  .error {
    max-width: 1380px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
  .error h2 { color: var(--text); font-size: 17px; margin: 0 0 8px; }
  .error p { font-size: 13px; line-height: 1.6; margin: 0 auto; max-width: 500px; }
  .error code {
    background: #ffffff10;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 12px;
    color: #c8cbd5;
  }
  .hidden { display: none !important; }
  @media (max-width: 760px) {
    .page { padding: 0 0 20px; }
    .top { padding: 11px 13px; margin: 0; }
    .caption { max-width: 42vw; font-size: 11px; }
    .brand { font-size: 13px; }
    .player-wrap { border-radius: 0; min-height: 210px; max-height: 75vh; }
    .info { padding: 15px 13px 0; }
    .info h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 4.8c0-.9 1-1.4 1.8-.9l10.4 6.2a1 1 0 0 1 0 1.8L8.8 18.1A1.05 1.05 0 0 1 7 17.2V4.8Z"/>
        </svg>
      </span>
      R·Films <span style="font-weight:450;color:#858b99">Player</span>
    </div>
    <div class="caption" id="topCaption">Плеер фильмов и сериалов</div>
  </div>

  <div id="playerContainer" class="player-wrap hidden">
    <iframe
      id="playerFrame"
      allowfullscreen
      allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *"
      referrerpolicy="origin"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-pointer-lock"
    ></iframe>
  </div>

  <div id="errorContainer" class="error hidden">
    <h2 id="errorTitle">Не передана ссылка на видео</h2>
    <p id="errorMessage">
      Добавьте в адрес страницы параметр <code>?embed=</code> со ссылкой на плеер Kodik,
      например: <code>?embed=//kodikplayer.com/video/112243/.../720p</code>
    </p>
  </div>

  <div id="infoContainer" class="info hidden">
    <h1 id="pageTitle">Видео</h1>
    <div class="meta" id="pageMeta">Плеер Kodik</div>
    <div class="actions">
      <a id="openExternal" class="btn primary" href="#" target="_blank" rel="noopener noreferrer">
        ↗ Открыть в новой вкладке
      </a>
      <a id="downloadLink" class="btn" href="#" target="_blank" rel="noopener noreferrer">
        ⬇ Скачать MP4
      </a>
      <button class="btn" id="copyPage" type="button">
        🔗 Скопировать ссылку на страницу
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const rawEmbed = (params.get('embed') || '').trim();
  const rawDownload = (params.get('download') || '').trim();
  const rawTitle = (params.get('title') || '').trim();

  const playerContainer = document.getElementById('playerContainer');
  const errorContainer = document.getElementById('errorContainer');
  const infoContainer = document.getElementById('infoContainer');
  const playerFrame = document.getElementById('playerFrame');
  const errorTitle = document.getElementById('errorTitle');
  const errorMessage = document.getElementById('errorMessage');
  const pageTitle = document.getElementById('pageTitle');
  const pageMeta = document.getElementById('pageMeta');
  const topCaption = document.getElementById('topCaption');
  const openExternal = document.getElementById('openExternal');
  const downloadLink = document.getElementById('downloadLink');

  // Приводим протокол-относительную ссылку к абсолютной
  function normalizeUrl(url) {
    if (!url) return '';
    if (url.startsWith('//')) return 'https:' + url;
    if (!url.startsWith('http://') && !url.startsWith('https://')) return 'https://' + url;
    return url;
  }

  function showError(title, message) {
    errorTitle.textContent = title;
    errorMessage.innerHTML = message;
    errorContainer.classList.remove('hidden');
    infoContainer.classList.add('hidden');
    playerContainer.classList.add('hidden');
  }

  // Нет ссылки на плеер — показываем подсказку
  if (!rawEmbed) {
    showError(
      'Не передана ссылка на видео',
      'Добавьте в адрес страницы параметр <code>?embed=</code> со ссылкой на плеер Kodik, ' +
      'например: <code>?embed=//kodikplayer.com/video/112243/.../720p</code>'
    );
    return;
  }

  const embedUrl = normalizeUrl(rawEmbed);
  const downloadUrl = rawDownload ? normalizeUrl(rawDownload) : '';
  const title = rawTitle || 'R·Films Player';

  // Проверяем, что ссылка на самом деле ведёт на kodikplayer.com
  let parsed;
  try {
    parsed = new URL(embedUrl);
  } catch (e) {
    showError('Некорректная ссылка', 'Не удалось разобрать URL плеера.');
    return;
  }

  if (!parsed.hostname.endsWith('kodikplayer.com')) {
    showError(
      'Некорректный источник',
      'Плеер поддерживает только ссылки с домена <code>kodikplayer.com</code>. ' +
      'Получен: <code>' + parsed.hostname + '</code>.'
    );
    return;
  }

  // Отображаем плеер в iframe
  playerFrame.src = embedUrl;
  playerContainer.classList.remove('hidden');
  infoContainer.classList.remove('hidden');

  // Заголовок и подпись
  pageTitle.textContent = title;
  topCaption.textContent = title;
  document.title = title + ' · R·Films Player';
  pageMeta.textContent = 'Плеер Kodik · Источник: ' + parsed.hostname;

  // Кнопка «Открыть в новой вкладке»
  openExternal.href = embedUrl;

  // Кнопка «Скачать MP4» — прячем, если ссылки нет
  if (downloadUrl) {
    downloadLink.href = downloadUrl;
    downloadLink.classList.remove('hidden');
  } else {
    downloadLink.classList.add('hidden');
  }

  // Копирование ссылки на страницу
  document.getElementById('copyPage').addEventListener('click', async () => {
    await copyToClipboard(location.href, 'Ссылка на страницу скопирована');
  });

  async function copyToClipboard(text, successMsg) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      showToast(successMsg);
    } catch (e) {
      showToast('Не удалось скопировать');
    }
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: #171922ee;
      border: 1px solid #ffffff22;
      color: #f2f3f7;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      box-shadow: 0 8px 24px #0008;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    `;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.opacity = '1'; });
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 220);
    }, 1800);
  }
})();
</script>
</body>
</html>
